<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nginx Monitor</title>
  <style>
    #statusChartContainer {

      width: 100%;
      position: relative;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #38bdf8;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #94a3b8;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
    }

    .card .value {
      font-size: 36px;
      font-weight: bold;
      color: #38bdf8;
    }

    .card .label {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .chart-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
    }

    .full-width {
      grid-column: span 2;
    }

    .range-btn {
      background: #334155;
      border: none;
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .range-btn.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }

    .field-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
    }

    .field-wrap.grow {
      flex: 1;
    }

    .field-wrap.grow-large {
      flex: 2;
    }

    .search-field {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
      line-height: 1;
      flex: 0 0 auto;
    }

    .toggle-btn {
      padding: 6px 14px;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Nginx Monitor Dashboard</h1>

  <div class="summary">
    <div class="card">
      <div class="value" id="total-requests">...</div>
      <div class="label">Total Requests</div>
    </div>
    <div class="card">
      <div class="value" id="unique-ips">...</div>
      <div class="label">Unique IPs</div>
    </div>
    <div class="card">
      <div class="value" id="errors">...</div>
      <div class="label">Errors (4xx/5xx)</div>
    </div>
  </div>


  <div class="chart-card full-width" style="margin-bottom: 16px;">
    <h2>Search Logs</h2>
    <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <div class="field-wrap grow">
        <input id="search-ip" class="search-field" type="text" placeholder="Search by IP...">
        <button class="icon-btn" onclick="clearSearchField('search-ip')" title="Clear IP search">x</button>
      </div>
      <div class="field-wrap grow-large" style="min-width:200px;">
        <input id="search-url" class="search-field" type="text" placeholder="Search by URL...">
        <button class="icon-btn" onclick="clearSearchField('search-url')" title="Clear URL search">x</button>
      </div>
      <div class="field-wrap">
        <select id="search-status" class="search-field">
          <option value="">All Status Codes</option>
          <option value="200">200</option>
          <option value="301">301</option>
          <option value="307">307</option>
          <option value="400">400</option>
          <option value="404">404</option>
          <option value="500">500</option>
        </select>
        <button class="icon-btn" onclick="clearSearchField('search-status')" title="Clear status search">x</button>
      </div>
      <div class="field-wrap">
        <input id="search-from" class="search-field" type="datetime-local">
        <button class="icon-btn" onclick="clearSearchField('search-from')" title="Clear from date">x</button>
      </div>
      <div class="field-wrap">
        <input id="search-to" class="search-field" type="datetime-local">
        <button class="icon-btn" onclick="clearSearchField('search-to')" title="Clear to date">x</button>
      </div>
      <div class="field-wrap" style="min-width:120px;">
        <input id="search-page-size" class="search-field" type="number" value="25" min="1" max="1000" title="Results per page">
        <span style="color:#64748b; font-size:13px;">per page</span>
      </div>
      <button onclick="runSearch()"
        style="padding:8px 20px; background:#38bdf8; border:none; border-radius:8px; color:#0f172a; font-weight:bold; cursor:pointer;">
        Search
      </button>
      <button onclick="clearSearch()"
        style="padding:8px 20px; background:#334155; border:none; border-radius:8px; color:#e2e8f0; cursor:pointer;">
        Clear
      </button>
    </div>
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead>
        <tr>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">IP</th>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">Time</th>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">Method</th>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">Path</th>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">Status</th>
          <th style="text-align:left; padding:8px; color:#94a3b8; border-bottom:1px solid #334155;">Size</th>
        </tr>
      </thead>
      <tbody id="search-results"></tbody>
    </table>
    <p id="search-count" style="margin-top:8px; color:#64748b; font-size:12px;"></p>
    <div id="search-pagination" style="display:flex; align-items:center; gap:12px; margin-top:12px;"></div>
  </div>

  <div class="chart-card full-width" style="margin-bottom: 16px;">
    <h2>Error Breakdown</h2>
    <table style="width:100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th style="text-align:left; padding: 8px; color:#94a3b8; border-bottom: 1px solid #334155;">Status Code</th>
          <th style="text-align:left; padding: 8px; color:#94a3b8; border-bottom: 1px solid #334155;">Count</th>
        </tr>
      </thead>
      <tbody id="error-table"></tbody>
    </table>
  </div>

  <div class="grid">
    <div class="chart-card full-width">

      <div
        style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">

        <h2>Traffic Over Time</h2>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <input id="traffic-ip-search" type="text" placeholder="Search IP traffic..." style="
          padding:8px 12px;
          background:#0f172a;
          border:1px solid #334155;
          border-radius:8px;
          color:#e2e8f0;
          min-width:220px;
        " />
          <button id="traffic-scale-toggle" class="toggle-btn" onclick="toggleTrafficScale()">Log Scale</button>
        </div>

      </div>
      <canvas id="trafficChart"></canvas>

    </div>
    <div class="chart-card full-width">

      <div
        style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">

        <h2>Status Codes Over Time</h2>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="range-btn" data-range="minute">Minutes</button>
          <button class="range-btn active" data-range="hour">Hours</button>
          <button class="range-btn" data-range="day">Days</button>
          <input id="status-limit" type="number" value="60" min="10" max="1440"
            style="width:80px; padding:6px 10px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e2e8f0;">
          <span id="status-limit-unit" style="color:#64748b; font-size:13px;">hours</span>
          <button id="scale-toggle" class="toggle-btn" onclick="toggleStatusScale()">
            Log Scale
          </button>
        </div>

      </div>

      <div style="overflow-x: auto;">
        <div id="statusChartContainer" style="min-width: 800px;">
          <canvas id="statusChart"></canvas>
        </div>
      </div>

    </div>
    <div class="chart-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px;">
        <h2 style="margin-bottom:0;">Top IPs</h2>
        <button id="ip-scale-toggle" class="toggle-btn" onclick="toggleIpScale()">Log Scale</button>
      </div>
      <canvas id="ipChart"></canvas>
    </div>
    <div class="chart-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="color:#f87171;">IPs Over Threshold</h2>
        <div style="display:flex; align-items:center; gap:8px;">
          <input id="threshold-page-size" type="number" value="5" min="1" max="50"
            style="width:60px; padding:6px 10px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e2e8f0;">
          <span style="color:#64748b; font-size:13px;">per page</span>
        </div>
      </div>
      <div id="threshold-table"></div>
    </div>
  </div>
  <div class="chart-card full-width" style="margin-top: 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2>System Logs</h2>
      <button onclick="loadSystemLogs()"
        style="padding:6px 14px; background:#334155; border:none; border-radius:8px; color:#e2e8f0; cursor:pointer;">
        Refresh
      </button>
    </div>
    <div id="system-logs" style="
      background:#0f172a;
      border-radius:8px;
      padding:16px;
      font-family:monospace;
      font-size:12px;
      max-height:300px;
      overflow-y:auto;
    "></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const API = "";

    Chart.defaults.animation = false;

    let trafficChart;
    let statusChart;
    let ipChart;
    let useTrafficLogScale = false;
    let useStatusLogScale = false;
    let useIpLogScale = false;
    const LOG_TICK_STEPS = [1, 2, 4, 6, 8];

    function formatPeriod(value) {
      if (!value) return "";
      const [datePart, timePart = ""] = String(value).split("T");
      const [year, month, day] = datePart.split("-");
      if (!year || !month || !day) return String(value).replace("T", " ");
      return `${day}-${month}-${year}${timePart ? ` ${timePart}` : ""}`;
    }

    function formatDateTime(value) {
      return formatPeriod(String(value || "").slice(0, 16));
    }

    function setToggleState(id, active) {
      document.getElementById(id).classList.toggle("active", active);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildCompressedTicks(maxValue) {
      const target = Math.max(1, Number(maxValue) || 1);
      const ticks = [];
      let multiplier = 1;

      while (ticks.length === 0 || ticks[ticks.length - 1] < target) {
        LOG_TICK_STEPS.forEach(step => ticks.push(step * multiplier));
        multiplier *= 10;
      }

      return ticks;
    }

    function compressedValue(value, ticks) {
      const numericValue = Number(value);
      if (!numericValue || numericValue < 1) return null;

      const exactIndex = ticks.indexOf(numericValue);
      if (exactIndex !== -1) return exactIndex;

      for (let i = 1; i < ticks.length; i += 1) {
        if (numericValue < ticks[i]) {
          const start = ticks[i - 1];
          const end = ticks[i];
          return (i - 1) + ((numericValue - start) / (end - start));
        }
      }

      return ticks.length - 1;
    }

    function compressedData(values, ticks) {
      return values.map(value => compressedValue(value, ticks));
    }

    function compressedAxisOptions(ticks) {
      return {
        type: "linear",
        min: 0,
        max: ticks.length - 1,
        ticks: {
          color: "#64748b",
          stepSize: 1,
          callback: value => Number.isInteger(Number(value)) ? ticks[value].toLocaleString() : null
        }
      };
    }

    async function loadThresholdIPs() {
      const res = await fetch(`${API}/stats/anomalies`);
      const data = await res.json();
      const container = document.getElementById("threshold-table");

      if (data.high_frequency.length === 0) {
        container.innerHTML = `<p style="color:#34d399;">✓ No IPs over threshold</p>`;
        return;
      }

      const alerts = data.high_frequency.map(d => ({
        level: "red",
        message: `IP <strong>${escapeHtml(d.ip)}</strong> sent <strong>${escapeHtml(d.count)}</strong> requests at ${formatPeriod(d.minute)}`
      }));

      const pageSize = parseInt(document.getElementById("threshold-page-size").value) || 5;
      let currentPage = 0;
      const totalPages = Math.ceil(alerts.length / pageSize);

      function renderPage(page) {
        const start = page * pageSize;
        const pageAlerts = alerts.slice(start, start + pageSize);
        container.innerHTML = pageAlerts.map(a => `
          <div style="padding:10px 16px;margin-bottom:8px;border-radius:8px;border-left:4px solid #f87171;background:rgba(248,113,113,0.1);color:#e2e8f0;font-size:14px;">${a.message}</div>
        `).join("");
        container.innerHTML += `
          <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
            <button onclick="thresholdPage(${page - 1})" ${page === 0 ? 'disabled' : ''}
              style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page === 0 ? 0.4 : 1};">← Prev</button>
            <span style="color:#64748b;font-size:13px;">Page ${page + 1} of ${totalPages} (${alerts.length} total)</span>
            <button onclick="thresholdPage(${page + 1})" ${page === totalPages - 1 ? 'disabled' : ''}
              style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page === totalPages - 1 ? 0.4 : 1};">Next →</button>
          </div>
        `;
      }

      window.thresholdPage = function (page) {
        if (page < 0 || page >= totalPages) return;
        currentPage = page;
        renderPage(currentPage);
      };

      renderPage(currentPage);
    }

    async function loadSummary() {
      const res = await fetch(`${API}/stats/summary`);
      const data = await res.json();
      document.getElementById("total-requests").textContent = data.total_requests.toLocaleString();
      document.getElementById("unique-ips").textContent = data.unique_ips.toLocaleString();
      document.getElementById("errors").textContent = data.errors.toLocaleString();
    }

    async function loadTraffic(ip = "") {
      const res = await fetch(`${API}/stats/traffic?granularity=hour&limit=500&ip=${encodeURIComponent(ip)}`);
      const data = await res.json();
      const labels = data.map(d => formatPeriod(d.period));
      const counts = data.map(d => Number(d.count) || 0);
      const compressedTicks = buildCompressedTicks(Math.max(...counts, 1));
      const chartData = useTrafficLogScale ? compressedData(counts, compressedTicks) : counts;

      if (trafficChart) {
        trafficChart.data.labels = labels;
        trafficChart.data.datasets[0].originalData = counts;
        trafficChart.data.datasets[0].data = chartData;
        trafficChart.options.scales.y = useTrafficLogScale
          ? compressedAxisOptions(compressedTicks)
          : { beginAtZero: true, ticks: { color: "#64748b" } };
        trafficChart.update("none");
        return;
      }

      trafficChart = new Chart(document.getElementById("trafficChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Requests",
            originalData: counts,
            data: chartData,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56,189,248,0.1)",
            fill: true,
            tension: 0.4,
            pointRadius: 0,
            pointHoverRadius: 5,
            hitRadius: 12,
            borderWidth: 2,
          }]
        },
        options: {
          animation: false,
          interaction: { mode: "index", intersect: false, axis: "x" },
          plugins: {
            legend: { labels: { color: "#e2e8f0" } },
            tooltip: {
              intersect: false,
              mode: "index",
              callbacks: {
                label: ctx => {
                  const originalValue = ctx.dataset.originalData?.[ctx.dataIndex] ?? ctx.parsed.y;
                  return ` ${ctx.dataset.label}: ${originalValue}`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: "#64748b", maxTicksLimit: 12 } },
            y: useTrafficLogScale
              ? compressedAxisOptions(compressedTicks)
              : { beginAtZero: true, ticks: { color: "#64748b" } }
          }
        }
      });
    }

    function toggleTrafficScale() {
      useTrafficLogScale = !useTrafficLogScale;
      setToggleState("traffic-scale-toggle", useTrafficLogScale);
      loadTraffic(document.getElementById("traffic-ip-search").value.trim());
    }

    function toggleStatusScale() {
      useStatusLogScale = !useStatusLogScale;
      setToggleState("scale-toggle", useStatusLogScale);
      loadStatusCodes(document.querySelector(".range-btn.active").dataset.range);
    }

    function updateStatusLimitUnit(range) {
      const units = { minute: "minutes", hour: "hours", day: "days" };
      document.getElementById("status-limit-unit").textContent = units[range] || "items";
    }

    async function loadStatusCodes(range = "hour") {
      updateStatusLimitUnit(range);
      const thresholds = { minute: 10, hour: 100, day: 1200 };
      const limit = parseInt(document.getElementById("status-limit").value) || 60;
      const res = await fetch(`${API}/stats/status-codes-over-time?granularity=${range}&limit=${limit}`);
      const data = await res.json();

      const colors = ["#38bdf8","#22c55e","#fbbf24","#f87171","#c084fc","#14b8a6","#f97316","#e11d48"];
      const labels = data.labels.map(l => formatPeriod(l));
      const maxCount = Math.max(
        thresholds[range],
        ...data.datasets.flatMap(dataset => dataset.data)
      );

      const compressedTicks = buildCompressedTicks(maxCount);
      const datasets = data.datasets.map((dataset, index) => {
        const originalData = dataset.data.map(value => Number(value) || 0);
        return {
          label: dataset.label,
          originalData,
          data: useStatusLogScale ? compressedData(originalData, compressedTicks) : originalData,
          borderColor: colors[index % colors.length],
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 8,
          hitRadius: 10,
          borderWidth: 2,
          spanGaps: true,
        };
      });

      datasets.push({
        label: `Threshold (${thresholds[range]})`,
        originalData: new Array(labels.length).fill(thresholds[range]),
        data: new Array(labels.length).fill(
          useStatusLogScale ? compressedValue(thresholds[range], compressedTicks) : thresholds[range]
        ),
        borderColor: "#ff4d4f",
        borderDash: [8, 8],
        borderWidth: 2,
        pointRadius: 0,
        tension: 0,
      });

      if (statusChart) {
        statusChart.destroy();
        statusChart = null;
      }

      const container = document.getElementById("statusChartContainer");
      const width = Math.max(labels.length * 25, container.parentElement.offsetWidth);
      container.style.width = width + "px";
      container.style.height = "400px";

      const oldCanvas = document.getElementById("statusChart");
      const newCanvas = document.createElement("canvas");
      newCanvas.id = "statusChart";
      newCanvas.width = width;
      newCanvas.height = 400;
      oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);

      statusChart = new Chart(newCanvas, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: false,
          animation: false,
          interaction: { mode: "point", intersect: true },
          plugins: {
            legend: { labels: { color: "#e2e8f0" } },
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#94a3b8",
              bodyColor: "#e2e8f0",
              borderColor: "#334155",
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: ctx => {
                  const originalValue = ctx.dataset.originalData?.[ctx.dataIndex] ?? ctx.parsed.y;
                  return ` ${ctx.dataset.label}: ${originalValue}`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: "#64748b", maxRotation: 45, minRotation: 45, autoSkip: false } },
            y: useStatusLogScale
              ? compressedAxisOptions(compressedTicks)
              : { beginAtZero: true, ticks: { color: "#64748b" } }
          }
        }
      });
    }

    function toggleIpScale() {
      useIpLogScale = !useIpLogScale;
      setToggleState("ip-scale-toggle", useIpLogScale);
      loadTopIPs();
    }

    async function loadTopIPs() {
      const res = await fetch(`${API}/stats/top-ips?limit=10`);
      const data = await res.json();
      const counts = data.map(d => d.count);

      if (ipChart) {
        ipChart.destroy();
      }

      ipChart = new Chart(document.getElementById("ipChart"), {
        type: "bar",
        data: {
          labels: data.map(d => d.ip),
          datasets: [{
            label: "Requests",
            originalData: counts,
            data: useIpLogScale ? compressedData(counts, buildCompressedTicks(Math.max(...counts, 1))) : counts,
            backgroundColor: "#38bdf8"
          }]
        },
        options: {
          animation: false,
          indexAxis: "y",
          plugins: {
            legend: { labels: { color: "#e2e8f0" } },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const originalValue = ctx.dataset.originalData?.[ctx.dataIndex] ?? ctx.parsed.x;
                  return ` ${ctx.dataset.label}: ${originalValue}`;
                }
              }
            }
          },
          scales: {
            x: useIpLogScale
              ? compressedAxisOptions(buildCompressedTicks(Math.max(...counts, 1)))
              : { beginAtZero: true, ticks: { color: "#64748b" } },
            y: { ticks: { color: "#64748b" } }
          }
        }
      });
    }

    async function loadErrorBreakdown() {
      const res = await fetch(`${API}/stats/status-codes`);
      const data = await res.json();
      const errors = data.filter(d => d.status >= 400);
      document.getElementById("error-table").innerHTML = errors.map(d => `
        <tr>
          <td style="padding:8px;color:#f87171;">${d.status}</td>
          <td style="padding:8px;color:#e2e8f0;">${d.count.toLocaleString()}</td>
        </tr>
      `).join("");
    }

    async function loadAnomalies() {
      const container = document.getElementById("anomaly-list");
      if (!container) return;

      const res = await fetch(`${API}/stats/anomalies`);
      const data = await res.json();
      const alerts = [];

      data.high_frequency.forEach(d => alerts.push({
        level: "red",
        message: `IP <strong>${escapeHtml(d.ip)}</strong> sent <strong>${escapeHtml(d.count)}</strong> requests in 1 minute at ${formatPeriod(d.minute)}`
      }));
      data.many_404s.forEach(d => alerts.push({
        level: "yellow",
        message: `IP <strong>${escapeHtml(d.ip)}</strong> triggered <strong>${escapeHtml(d.count)}</strong> 404 errors`
      }));
      data.many_500s.forEach(d => alerts.push({
        level: "red",
        message: `IP <strong>${escapeHtml(d.ip)}</strong> caused <strong>${escapeHtml(d.count)}</strong> server errors (500)`
      }));

      if (alerts.length === 0) {
        container.innerHTML = `<p style="color:#34d399;">✓ No anomalies detected</p>`;
        return;
      }

      let pageSize = parseInt(document.getElementById("anomaly-page-size")?.value) || 5;
      let currentPage = 0;
      const totalPages = Math.ceil(alerts.length / pageSize);

      function renderPage(page) {
        const pageAlerts = alerts.slice(page * pageSize, page * pageSize + pageSize);
        container.innerHTML = pageAlerts.map(a => `
          <div style="padding:10px 16px;margin-bottom:8px;border-radius:8px;border-left:4px solid ${a.level === 'red' ? '#f87171' : '#fbbf24'};background:${a.level === 'red' ? 'rgba(248,113,113,0.1)' : 'rgba(251,191,36,0.1)'};color:#e2e8f0;font-size:14px;">${a.message}</div>
        `).join("");
        container.innerHTML += `
          <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
            <button onclick="anomalyPage(${page - 1})" ${page === 0 ? 'disabled' : ''}
              style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page === 0 ? 0.4 : 1};">← Prev</button>
            <span style="color:#64748b;font-size:13px;">Page ${page + 1} of ${totalPages} (${alerts.length} total)</span>
            <button onclick="anomalyPage(${page + 1})" ${page === totalPages - 1 ? 'disabled' : ''}
              style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page === totalPages - 1 ? 0.4 : 1};">Next →</button>
          </div>
        `;
      }

      window.anomalyPage = function (page) {
        if (page < 0 || page >= totalPages) return;
        currentPage = page;
        renderPage(currentPage);
      };

      renderPage(currentPage);
    }

    async function runSearch(page = 0) {
      const ip = document.getElementById("search-ip").value.trim();
      const path = document.getElementById("search-url").value.trim();
      const status = document.getElementById("search-status").value;
      const from = document.getElementById("search-from").value;
      const to = document.getElementById("search-to").value;
      const pageSize = Math.min(Math.max(parseInt(document.getElementById("search-page-size").value) || 25, 1), 1000);
      const hasSearchCriteria = Boolean(ip || path || status || from || to);

      if (!hasSearchCriteria) {
        document.getElementById("search-results").innerHTML = "";
        document.getElementById("search-count").textContent = "Enter at least one search filter.";
        document.getElementById("search-pagination").innerHTML = "";
        return;
      }

      const params = new URLSearchParams({
        limit: String(pageSize),
        offset: String(page * pageSize),
      });
      if (ip) params.set("ip", ip);
      if (path) params.set("path", path);
      if (status) params.set("status", status);
      if (from) params.set("time_from", from);
      if (to) params.set("time_to", to);

      const res = await fetch(`${API}/stats/search?${params.toString()}`);
      const payload = await res.json();
      const data = payload.rows || [];
      const total = payload.total || 0;
      const totalPages = Math.max(Math.ceil(total / pageSize), 1);
      const statusColor = s => s >= 500 ? "#f87171" : s >= 400 ? "#fbbf24" : "#34d399";

      document.getElementById("search-results").innerHTML = data.map(r => `
        <tr style="border-bottom:1px solid #1e293b;">
          <td style="padding:8px;color:#38bdf8;">${escapeHtml(r.ip)}</td>
          <td style="padding:8px;color:#64748b;">${formatDateTime(r.time)}</td>
          <td style="padding:8px;color:#94a3b8;">${escapeHtml(r.method)}</td>
          <td style="padding:8px;color:#e2e8f0;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.path)}</td>
          <td style="padding:8px;color:${statusColor(r.status)};">${escapeHtml(r.status)}</td>
          <td style="padding:8px;color:#64748b;">${escapeHtml(r.size)}</td>
        </tr>
      `).join("");
      const start = total === 0 ? 0 : (page * pageSize) + 1;
      const end = Math.min((page + 1) * pageSize, total);
      document.getElementById("search-count").textContent = total === 0
        ? "No matching logs found."
        : `Showing ${start}-${end} of ${total} results`;
      document.getElementById("search-pagination").innerHTML = totalPages <= 1 ? "" : `
        <button onclick="runSearch(${page - 1})" ${page === 0 ? "disabled" : ""}
          style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page === 0 ? 0.4 : 1};">Prev</button>
        <span style="color:#64748b;font-size:13px;">Page ${page + 1} of ${totalPages}</span>
        <button onclick="runSearch(${page + 1})" ${page >= totalPages - 1 ? "disabled" : ""}
          style="padding:6px 14px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer;opacity:${page >= totalPages - 1 ? 0.4 : 1};">Next</button>
      `;
    }

    function clearSearchField(id) {
      document.getElementById(id).value = "";
    }

    function clearSearch() {
      document.getElementById("search-ip").value = "";
      document.getElementById("search-url").value = "";
      document.getElementById("search-status").value = "";
      document.getElementById("search-from").value = "";
      document.getElementById("search-to").value = "";
      document.getElementById("search-results").innerHTML = "";
      document.getElementById("search-count").textContent = "";
      document.getElementById("search-pagination").innerHTML = "";
    }

    async function loadSystemLogs() {
      const res = await fetch(`${API}/stats/logs`);
      const data = await res.json();
      const container = document.getElementById("system-logs");
      const colorLine = line => {
        const safeLine = escapeHtml(line);
        if (line.includes("[ERROR]")) return `<span style="color:#f87171;">${safeLine}</span>`;
        if (line.includes("[WARNING]")) return `<span style="color:#fbbf24;">${safeLine}</span>`;
        if (line.includes("[INFO]")) return `<span style="color:#34d399;">${safeLine}</span>`;
        return `<span style="color:#64748b;">${safeLine}</span>`;
      };
      container.innerHTML = data.lines.map(l => colorLine(l.trimEnd())).join("<br>");
      container.scrollTop = container.scrollHeight;
    }

    document.querySelectorAll(".range-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadStatusCodes(btn.dataset.range);
      });
    });

    document.getElementById("traffic-ip-search").addEventListener("input", async function () {
      const ip = this.value.trim();
      if (ip === "" || /^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) loadTraffic(ip);
    });

    document.getElementById("status-limit").addEventListener("change", () => {
      loadStatusCodes(document.querySelector(".range-btn.active").dataset.range);
    });

    document.getElementById("search-page-size").addEventListener("change", () => {
      runSearch();
    });

    document.getElementById("threshold-page-size").addEventListener("change", () => {
      loadThresholdIPs();
    });

    Promise.all([
      loadSummary(),
      loadErrorBreakdown(),
      loadTopIPs(),
      loadTraffic(),
      loadStatusCodes("hour"),
      loadThresholdIPs(),
      loadSystemLogs(),
    ]);
  </script>

</body>
